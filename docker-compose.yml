services:
  app:
    build: .
    ports: ["8501:8501"]
    volumes: ["./data:/app/data", "./logs:/app/logs", "./models:/app/models"]
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment: ["PRECARITY_API_KEY=${PRECARITY_API_KEY:-}"]
    volumes: ["./models:/app/models", "./logs:/app/logs"]
